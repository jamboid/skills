<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — {{PROJECT}}</title>
<style>
/* == tokens:start == */
:root {
  /* Surfaces — warm stone */
  --c-bg:               #fafaf9;
  --c-surface:          #ffffff;
  --c-surface-alt:      #f4f4f2;
  --c-sidebar-bg:       #efeeea;
  --c-sidebar-hover:    #f4f4f2;
  --c-sidebar-active:   #1a1a18;
  --c-sidebar-active-bg:#e3e1db;

  /* Text */
  --c-text:             #1a1a18;
  --c-text-muted:       #5a5a55;
  --c-text-faint:       #8a8a82;

  /* Lines */
  --c-border:           #e5e4e0;
  --c-border-strong:    #d4d2cc;

  /* Brand accent — THE ONE KNOB. Set this to the client's colour and the three
     derived values below follow it. It must clear 4.5:1 on --c-bg; if the brand
     colour is lighter than that, use a darkened version of it here. */
  --c-accent:           #3341c2;
  /* Derived — don't set these by hand. */
  --c-accent-ink:       color-mix(in srgb, var(--c-accent) 85%, black);      /* text on a tint */
  --c-accent-soft:      color-mix(in srgb, var(--c-accent) 12%, var(--c-bg)); /* tinted fill */
  --c-accent-line:      color-mix(in srgb, var(--c-accent) 25%, var(--c-bg)); /* section rule */

  /* Status */
  --c-good:             #13732f;   --c-good-soft: #d8f3e1;
  --c-warn:             #a34a07;   --c-warn-soft: #fdeac6;
  --c-bad:              #b91c1c;   --c-bad-soft:  #fbdad4;

  /* Code — always dark, never inverted */
  --c-code-bg:          #161c2d;
  --c-code-text:        #abb2bf;
  --c-code-border:      #2a3347;

  /* Shape + layout */
  --radius:             6px;
  --shadow-sm:          0 1px 2px rgba(20,20,18,.04);
  --shadow-md:          0 4px 14px rgba(20,20,18,.06);
  --sidebar-w:          268px;
  --content-max:        760px;

  /* Type — three families with three jobs. System stacks only: no downloads. */
  --font-display:       system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body:          'Iowan Old Style', 'Palatino Linotype', Palatino, 'Source Serif 4', Georgia, serif;
  --font-mono:          'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace;
  --font-sans:          var(--font-display);
}
/* == tokens:end == */

/* ── Landing page. Shares the tokens above with the page scaffolds; the rest is
   its own, because a link list has no prose to style. ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  background: var(--c-bg);
  color: var(--c-text);
}
a { color: var(--c-accent); }

.page { max-width: var(--content-max); margin: 0 auto; padding: 64px 24px 80px; }

.brand {
  display: flex; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
  gap: 16px;
  margin-bottom: 40px;
}
.brand svg { display: block; height: auto; }
.brand-client { color: var(--c-accent); }
.brand-good { width: 64px; color: var(--c-text); }

.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--c-accent);
  margin-bottom: 12px;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(30px, 4.5vw, 44px); font-weight: 800;
  line-height: 1.05; letter-spacing: -0.025em;
  text-wrap: balance;
  margin-bottom: 14px;
}
.lede {
  font-family: var(--font-display);
  font-size: 19px; line-height: 1.5;
  color: var(--c-text-muted);
  text-wrap: balance;
  margin-bottom: 40px;
}

/* ── Link list — one entry per page ── */
.links { display: flex; flex-direction: column; gap: 10px; }
.links a {
  display: block;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-left: 3px solid var(--c-accent);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 18px 22px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.links a:hover { border-color: var(--c-border-strong); border-left-color: var(--c-accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.links h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 3px; }
.links p { font-size: 15px; color: var(--c-text-muted); margin: 0; }

footer {
  border-top: 1px solid var(--c-border);
  margin-top: 64px; padding-top: 24px;
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--c-text-faint);
}

@media (max-width: 600px) { .page { padding: 48px 18px 60px; } body { font-size: 16px; } }
</style>
</head>
<body>
<div class="page">

  <!-- Optional brand row — delete if unbranded. -->
  <div class="brand">
    <span class="brand-client">{{CLIENT_MARK}}</span>
    <span class="brand-good">{{GOOD_MARK}}</span>
  </div>

  <div class="page-eyebrow">{{EYEBROW}}</div>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{LEDE}}</p>

  <div class="links">
    <!-- One per detail page:
    <a href="detail-slug.html"><h2>Page title</h2><p>One-line description.</p></a>
    -->
{{LINKS}}
  </div>

  <footer>
    <span>{{PROJECT}}</span>
    <span>{{DATE}}</span>
  </footer>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — {{PROJECT}}</title>
<style>
/* == tokens:start == */
:root {
  /* Surfaces — warm stone */
  --c-bg:               #fafaf9;
  --c-surface:          #ffffff;
  --c-surface-alt:      #f4f4f2;
  --c-sidebar-bg:       #efeeea;
  --c-sidebar-hover:    #f4f4f2;
  --c-sidebar-active:   #1a1a18;
  --c-sidebar-active-bg:#e3e1db;

  /* Text */
  --c-text:             #1a1a18;
  --c-text-muted:       #5a5a55;
  --c-text-faint:       #8a8a82;

  /* Lines */
  --c-border:           #e5e4e0;
  --c-border-strong:    #d4d2cc;

  /* Brand accent — THE ONE KNOB. Set this to the client's colour and the three
     derived values below follow it. It must clear 4.5:1 on --c-bg; if the brand
     colour is lighter than that, use a darkened version of it here. */
  --c-accent:           #3341c2;
  /* Derived — don't set these by hand. */
  --c-accent-ink:       color-mix(in srgb, var(--c-accent) 85%, black);      /* text on a tint */
  --c-accent-soft:      color-mix(in srgb, var(--c-accent) 12%, var(--c-bg)); /* tinted fill */
  --c-accent-line:      color-mix(in srgb, var(--c-accent) 25%, var(--c-bg)); /* section rule */

  /* Status */
  --c-good:             #13732f;   --c-good-soft: #d8f3e1;
  --c-warn:             #a34a07;   --c-warn-soft: #fdeac6;
  --c-bad:              #b91c1c;   --c-bad-soft:  #fbdad4;

  /* Code — always dark, never inverted */
  --c-code-bg:          #161c2d;
  --c-code-text:        #abb2bf;
  --c-code-border:      #2a3347;

  /* Shape + layout */
  --radius:             6px;
  --shadow-sm:          0 1px 2px rgba(20,20,18,.04);
  --shadow-md:          0 4px 14px rgba(20,20,18,.06);
  --sidebar-w:          268px;
  --content-max:        760px;

  /* Type — three families with three jobs. System stacks only: no downloads. */
  --font-display:       system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body:          'Iowan Old Style', 'Palatino Linotype', Palatino, 'Source Serif 4', Georgia, serif;
  --font-mono:          'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace;
  --font-sans:          var(--font-display);
}
/* == tokens:end == */

/* == base:start == */
/* ── Base elements — plain semantic HTML inherits the look ──
   One measure for the whole column: the width lives on the container, never on
   individual children. (`70ch` on every child resolves against each child's own
   font-size, so headings and paragraphs end up with different right edges.) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  background: var(--c-bg);
  color: var(--c-text);
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  line-height: 1.2;
  color: var(--c-text);
  text-wrap: balance;
}
h1 { font-size: clamp(30px, 4.5vw, 44px); font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 16px; }
h2 {
  font-size: 26px; font-weight: 700; letter-spacing: -0.015em;
  margin: 56px 0 16px;
  padding-top: 30px;
  border-top: 3px solid var(--c-accent-line);
  scroll-margin-top: 24px;
}
/* The masthead already closes with a rule — don't stack a second one on it. */
h2:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.005em; margin: 32px 0 8px; }
h4 {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--c-text-muted);
  margin: 24px 0 6px;
}

p { margin-bottom: 16px; }
ul, ol { padding-left: 24px; margin: 0 0 16px; }
li { margin-bottom: 6px; }
li > ul, li > ol { margin: 6px 0 0; }
a { color: var(--c-accent); text-decoration: underline; text-underline-offset: 2px; }
strong { font-weight: 700; }
em { font-style: italic; }
hr { border: 0; border-top: 1px solid var(--c-border); margin: 40px 0; }
img { display: block; max-width: 100%; height: auto; border-radius: var(--radius); }

blockquote {
  margin: 20px 0;
  padding: 2px 20px;
  border-left: 3px solid var(--c-accent);
  color: var(--c-text-muted);
}
blockquote p:last-child { margin-bottom: 0; }

/* Inline code */
code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--c-surface-alt);
  border: 1px solid var(--c-border);
  padding: 1px 3px;
  border-radius: var(--radius);
  overflow-wrap: anywhere;
}
/* Code block — always dark */
pre {
  background: var(--c-code-bg);
  color: var(--c-code-text);
  border: 1px solid var(--c-code-border);
  border-radius: var(--radius);
  padding: 16px 18px;
  overflow-x: auto;
  margin: 20px 0;
  font-size: 13.5px;
  line-height: 1.7;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-family: var(--font-display);
  font-size: 15px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  overflow: hidden;
}
th {
  background: var(--c-surface-alt);
  text-align: left;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--c-text-muted);
  padding: 10px 16px;
  border-bottom: 1px solid var(--c-border);
}
td { padding: 11px 16px; border-bottom: 1px solid var(--c-border); vertical-align: top; }
tr:last-child td { border-bottom: none; }

/* Figure — diagrams and captioned media. Put inline SVG straight in here;
   it fills the column and scales. No per-page style block needed. */
figure {
  margin: 28px 0;
  padding: 24px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
figure > svg, figure > img { display: block; width: 100%; height: auto; }
figure > pre { margin: 0; }
figure > p:last-child { margin-bottom: 0; }
/* The caption is its own strip, flush to the bottom of the box. */
figcaption {
  font-family: var(--font-display);
  font-size: 13.5px; line-height: 1.5;
  color: var(--c-text-muted);
  margin: 24px -24px -24px;
  padding: 14px 24px;
  background: var(--c-surface-alt);
  border-top: 1px solid var(--c-border);
}

/* ── Masthead — the document opener ── */
.masthead { margin-bottom: 48px; padding-bottom: 28px; border-bottom: 1px solid var(--c-border); }
.brand {
  display: flex; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
  gap: 16px;
  margin-bottom: 36px;
}
.brand svg { display: block; height: auto; }
.brand-client { color: var(--c-accent); }
.brand-good { width: 64px; color: var(--c-text); }
.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--c-accent);
  margin-bottom: 12px;
}
.lede {
  font-family: var(--font-display);
  font-size: 19px; line-height: 1.5;
  color: var(--c-text-muted);
  text-wrap: balance;
  margin-bottom: 0;
}
.meta {
  display: flex; flex-wrap: wrap;
  gap: 6px 22px;
  margin: 24px 0 0; padding: 0;
  list-style: none;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--c-text-muted);
}
.meta li { margin: 0; }
.meta strong { color: var(--c-text); font-weight: 600; }

/* ── Patterns — a small set, all built from tokens ── */

/* Callout: a note that needs to sit apart from the prose. */
.callout {
  position: relative;
  margin: 20px 0;
  padding: 14px 18px 14px 24px;
  background: var(--c-surface-alt);
  border-radius: var(--radius);
  overflow: hidden;
}
/* The colour band is a positioned bar, not a border: the box's radius slices its
   corners off square rather than bending it round the curve. Its width matches
   the box's radius so the band fills the corner and reaches its top and bottom. */
.callout::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--radius);
  background: var(--c-border-strong);
}
.callout > :last-child { margin-bottom: 0; }
.callout-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--c-text-muted);
  margin-bottom: 4px;
}
.callout--note { background: var(--c-accent-soft); }
.callout--note::before { background: var(--c-accent); }
.callout--note .callout-label { color: var(--c-accent-ink); }
.callout--warn { background: var(--c-warn-soft); }
.callout--warn::before { background: var(--c-warn); }
.callout--warn .callout-label { color: var(--c-warn); }
.callout--good { background: var(--c-good-soft); }
.callout--good::before { background: var(--c-good); }
.callout--good .callout-label { color: var(--c-good); }
.callout--bad { background: var(--c-bad-soft); }
.callout--bad::before { background: var(--c-bad); }
.callout--bad .callout-label { color: var(--c-bad); }

/* Key fact: a label, a value worth seeing at a glance, an optional note. */
.keyfact {
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 4px 14px;
  margin: 20px 0;
  padding: 14px 18px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.keyfact-label {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--c-text-muted);
}
.keyfact-value {
  font-family: var(--font-display);
  font-size: 21px; font-weight: 700;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.keyfact-note { flex-basis: 100%; font-size: 15px; color: var(--c-text-muted); }

/* Definition rows: term and description, side by side on wide screens. */
.deflist { margin: 20px 0; border-top: 1px solid var(--c-border); }
.deflist > div {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px 28px;
  padding: 18px 0;
  border-bottom: 1px solid var(--c-border);
}
.deflist dt { font-family: var(--font-display); font-weight: 700; font-size: 16.5px; line-height: 1.35; text-wrap: pretty; }
.deflist dd { margin: 0; }
.deflist dd > :last-child { margin-bottom: 0; }

/* Steps: a numbered sequence where the order is the point. */
.steps {
  list-style: none;
  margin: 24px 0;
  padding: 0;
  border-top: 1px solid var(--c-border);
  counter-reset: step;
}
.steps > li {
  counter-increment: step;
  position: relative;
  margin: 0;
  padding: 20px 0 20px 44px;
  border-bottom: 1px solid var(--c-border);
}
.steps > li::before {
  content: counter(step);
  position: absolute;
  left: 0; top: 18px;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--c-accent-soft);
  color: var(--c-accent-ink);
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 600;
}
.steps > li > :last-child { margin-bottom: 0; }
.steps h3 { margin: 0 0 6px; font-size: 17px; }

/* ── Footer ── */
footer {
  border-top: 1px solid var(--c-border);
  margin-top: 64px; padding-top: 24px;
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--c-text-faint);
}

/* ── Responsive (type + rhythm; layout lives with each scaffold's shell) ── */
@media (max-width: 600px) {
  body { font-size: 16px; }
  h2 { margin-top: 44px; }
  .brand { margin-bottom: 28px; }
  .meta { gap: 4px 16px; }
  .steps > li { padding-left: 38px; }
  figure { padding: 16px; }
  figcaption { margin: 16px -16px -16px; padding: 12px 16px; }
  h2 { padding-top: 24px; }
  .steps > li::before { width: 24px; height: 24px; font-size: 12px; }
}
@media (min-width: 720px) {
  .deflist > div { grid-template-columns: 200px 1fr; }
}
@media print {
  body { background: #fff; }
  .callout, .keyfact, .steps > li, figure { break-inside: avoid; }
  pre { white-space: pre-wrap; }
}
/* == base:end == */

/* ── Layout shell — sidebar + one content column, one measure ── */
body { display: flex; min-height: 100vh; }

.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--c-sidebar-bg);
  border-right: 1px solid var(--c-border-strong);
  overflow-y: auto;
  z-index: 100;
  display: flex;
  flex-direction: column;
  font-family: var(--font-display);
  transition: transform 0.25s ease;
}
.sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--c-border-strong); }
.sidebar-title {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--c-text-muted); margin-bottom: 6px;
}
.sidebar-subtitle { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
.sidebar-meta { font-family: var(--font-mono); font-size: 11px; color: var(--c-text-muted); margin-top: 6px; }
.sidebar-nav { padding: 12px 0 24px; flex: 1; }
.sidebar-nav a {
  display: block;
  padding: 6px 20px;
  font-size: 13.5px;
  color: var(--c-text-muted);
  text-decoration: none;
  border-left: 2px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}
.sidebar-nav a:hover { color: var(--c-text); background: var(--c-sidebar-hover); }
.sidebar-nav a.active {
  color: var(--c-sidebar-active); font-weight: 600;
  background: var(--c-sidebar-active-bg); border-left-color: var(--c-accent);
}
.sidebar-nav .nav-label {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--c-text-faint); padding: 16px 20px 4px;
}

.mob-toggle {
  display: none;
  position: fixed; top: 14px; left: 14px; z-index: 200;
  background: var(--c-sidebar-bg); color: var(--c-text);
  border: 1px solid var(--c-border); border-radius: var(--radius);
  width: 40px; height: 40px; cursor: pointer;
  align-items: center; justify-content: center;
}
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
.sidebar-overlay.active { display: block; }

.content { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }
.content-inner { max-width: var(--content-max); margin: 0 auto; padding: 56px 24px 96px; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(calc(-1 * var(--sidebar-w))); }
  .sidebar.open { transform: translateX(0); }
  .content { margin-left: 0; }
  .mob-toggle { display: flex; }
  .content-inner { padding: 64px 20px 72px; }
}
@media (max-width: 600px) { .content-inner { padding: 64px 18px 64px; } }
@media print {
  .sidebar, .mob-toggle, .sidebar-overlay { display: none; }
  .content { margin-left: 0; }
  .content-inner { padding: 24px; max-width: 100%; }
}
</style>
</head>
<body>

<button class="mob-toggle" id="mobToggle" aria-label="Open navigation" aria-expanded="false">
  <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><rect width="18" height="2" rx="1" fill="currentColor"/><rect y="6" width="18" height="2" rx="1" fill="currentColor"/><rect y="12" width="18" height="2" rx="1" fill="currentColor"/></svg>
</button>
<div class="sidebar-overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">{{PROJECT}}</div>
    <div class="sidebar-subtitle">{{TITLE}}</div>
    <div class="sidebar-meta">{{DATE}}</div>
  </div>
  <nav class="sidebar-nav" aria-label="Sections">
    <!-- One link per section; href + data-target must equal the section id (drives scroll-spy).
         Group with <div class="nav-label">Group</div>. -->
{{SIDEBAR_NAV}}
  </nav>
</aside>

<main class="content">
  <div class="content-inner">

    <header class="masthead">
      <!-- Optional brand row. Paste the client's mark inline on the left; the Good
           mark is in assets/brand-good.svg. Delete the whole row if unbranded. -->
      <div class="brand">
        <span class="brand-client">{{CLIENT_MARK}}</span>
        <span class="brand-good">{{GOOD_MARK}}</span>
      </div>
      <div class="page-eyebrow">{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
      <p class="lede">{{LEDE}}</p>
      <ul class="meta">
        <li><strong>{{AUTHOR}}</strong></li>
        <li>{{DATE}}</li>
        <li>{{STATUS}}</li>
      </ul>
    </header>

    <!-- Write plain semantic HTML here. Base elements and the patterns
         (.callout, .keyfact, .deflist, .steps, figure) are styled by the shell —
         never add a style block or a max-width override down here.
         Give each major section an id matching its sidebar link. -->
{{CONTENT}}

    <footer>
      <span>{{PROJECT}}</span>
      <span>{{TITLE}}</span>
    </footer>

  </div>
</main>

<script>
(function () {
  var sidebar = document.getElementById('sidebar');
  var toggle  = document.getElementById('mobToggle');
  var overlay = document.getElementById('overlay');
  if (sidebar && toggle) {
    function open()  { sidebar.classList.add('open'); overlay.classList.add('active'); toggle.setAttribute('aria-expanded','true'); }
    function close() { sidebar.classList.remove('open'); overlay.classList.remove('active'); toggle.setAttribute('aria-expanded','false'); }
    toggle.addEventListener('click', function () { sidebar.classList.contains('open') ? close() : open(); });
    if (overlay) overlay.addEventListener('click', close);
    sidebar.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { if (window.innerWidth <= 900) close(); });
    });

    // Scroll-spy
    var links = sidebar.querySelectorAll('a[data-target]');
    var targets = Array.prototype.map.call(links, function (l) { return { l: l, el: document.getElementById(l.dataset.target) }; })
      .filter(function (t) { return t.el; });
    if (targets.length) {
      var obs = new IntersectionObserver(function (entries) {
        var vis = entries.filter(function (e) { return e.isIntersecting; })
          .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
        if (vis.length) links.forEach(function (l) { l.classList.toggle('active', l.dataset.target === vis[0].target.id); });
      }, { rootMargin: '-10% 0px -80% 0px', threshold: 0 });
      targets.forEach(function (t) { obs.observe(t.el); });
    }
  }
})();
</script>
</body>
</html>
